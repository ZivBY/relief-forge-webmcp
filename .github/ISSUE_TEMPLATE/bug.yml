name: Bug report
description: Report reproducible application, geometry, or export behavior.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the geometry family, controls, seed, and project ID.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
  - type: textarea
    id: fabrication
    attributes:
      label: Export, slicer, or physical context
      description: Identify file type, slicer/printer profile, and whether evidence is digital or physical.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed passwords, tokens, private paths, and confidential files.
          required: true
